<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- PWA 필수 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />

    <!-- iOS PWA 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="중고감정사" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- SEO -->
    <title>중고 감정사 — AI 중고거래 분석</title>
    <meta name="description" content="중고거래 시세, 사기 위험도, 정품 가능성을 AI가 한 번에 분석해드려요" />

    <!-- OG 태그 (카카오톡 공유 시 미리보기) -->
    <meta property="og:title" content="중고 감정사" />
    <meta property="og:description" content="중고거래 시세·사기위험·정품 가능성을 AI가 분석해드려요" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior: none;
      }
      /* iOS 노치 대응 */
      #root {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
